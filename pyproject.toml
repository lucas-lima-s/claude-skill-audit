[project]
name = "skill-audit"
version = "0.2.0"
description = "Claude Code skill that audits other skills against public-release standards."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/check.py" = ["E402"]
"scripts/report.py" = ["E402"]
"scripts/init_skill.py" = ["E402"]
"scripts/fix.py" = ["E402"]
"scripts/sync_auditlib.py" = ["E402"]
"scripts/render_demo.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
